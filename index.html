<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI絵本メーカー</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
      background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 50%, #a1c4fd 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    h1 {
      font-size: 2.2rem;
      color: #fff;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.2);
      margin-bottom: 8px;
      text-align: center;
    }

    .subtitle {
      color: rgba(255,255,255,0.9);
      margin-bottom: 32px;
      font-size: 1rem;
      text-align: center;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 36px;
      max-width: 620px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    }

    label {
      display: block;
      font-weight: 600;
      color: #555;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e8e8e8;
      border-radius: 12px;
      font-size: 1rem;
      margin-bottom: 20px;
      transition: border-color 0.2s;
      outline: none;
    }

    input:focus, select:focus, textarea:focus { border-color: #fcb69f; }
    textarea { height: 80px; resize: none; }

    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #fcb69f, #a1c4fd);
      color: white;
      font-size: 1.1rem;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 20px rgba(161,196,253,0.4);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(161,196,253,0.5);
    }

    /* 起承転結バッジ */
    .chapter-label {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: 0.05em;
    }
    .ki  { background: #e0f7e9; color: #2e7d32; }
    .sho { background: #fff3e0; color: #e65100; }
    .ten { background: #fce4ec; color: #c62828; }
    .ke  { background: #e8eaf6; color: #283593; }

    .book { margin-top: 32px; display: none; }

    .book-cover {
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 16px;
      padding: 32px;
      color: white;
      text-align: center;
      margin-bottom: 24px;
    }
    .book-cover .emoji { font-size: 4rem; margin-bottom: 12px; }
    .book-cover h2 { font-size: 1.6rem; margin-bottom: 6px; }
    .book-cover p  { opacity: 0.85; font-size: 0.9rem; }

    /* 章ヘッダー */
    .chapter-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0 12px;
    }
    .chapter-header .ch-badge {
      font-size: 1.4rem;
      font-weight: 900;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .ch-ki  { background: #e0f7e9; color: #2e7d32; }
    .ch-sho { background: #fff3e0; color: #e65100; }
    .ch-ten { background: #fce4ec; color: #c62828; }
    .ch-ke  { background: #e8eaf6; color: #283593; }
    .chapter-header .ch-title { font-weight: 700; font-size: 1rem; color: #444; }
    .chapter-header .ch-desc  { font-size: 0.8rem; color: #999; }

    .pages { display: flex; flex-direction: column; gap: 10px; }

    .page {
      background: #fafafa;
      border-radius: 10px;
      padding: 16px 20px;
      font-size: 0.95rem;
      color: #444;
      line-height: 1.8;
      animation: fadeIn 0.4s ease forwards;
      opacity: 0;
    }
    .page.ki  { border-left: 4px solid #66bb6a; }
    .page.sho { border-left: 4px solid #ffa726; }
    .page.ten { border-left: 4px solid #ef5350; }
    .page.ke  { border-left: 4px solid #5c6bc0; }

    .page-num {
      font-size: 0.72rem;
      color: #bbb;
      margin-bottom: 4px;
      font-weight: 600;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .steps {
      margin-top: 32px;
      background: #f0f4ff;
      border-radius: 16px;
      padding: 24px;
    }
    .steps h3 { font-size: 1rem; color: #667eea; margin-bottom: 16px; }
    .step-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
      font-size: 0.9rem;
      color: #555;
    }
    .step-num {
      background: #667eea;
      color: white;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .legend {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      color: #666;
    }
    .legend-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <h1>📖 AI絵本メーカー</h1>
  <p class="subtitle">テーマを入力して、あなただけの絵本を作ろう</p>

  <div class="card">
    <label>📌 絵本のテーマ</label>
    <input type="text" id="theme" placeholder="例：勇気ある少女の冒険" />

    <label>🧒 主人公の名前</label>
    <input type="text" id="hero" placeholder="例：ミナ" />

    <label>👫 友達・仲間の名前</label>
    <input type="text" id="friend" placeholder="例：小さなドラゴンのリュウ" />

    <label>😈 立ちはだかる困難・敵</label>
    <input type="text" id="obstacle" placeholder="例：闇の霧が森を覆っている" />

    <label>🎨 舞台・世界観</label>
    <input type="text" id="world" placeholder="例：魔法の森" />

    <label>💬 伝えたいメッセージ</label>
    <textarea id="message" placeholder="例：失敗しても諦めなければ夢は叶う"></textarea>

    <button onclick="generate()">✨ 絵本の構成を生成する（30ページ）</button>

    <div class="book" id="book">
      <div class="book-cover">
        <div class="emoji">📚</div>
        <h2 id="bookTitle"></h2>
        <p id="bookSub"></p>
      </div>

      <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:#66bb6a"></div>起（はじまり）</div>
        <div class="legend-item"><div class="legend-dot" style="background:#ffa726"></div>承（ひろがり）</div>
        <div class="legend-item"><div class="legend-dot" style="background:#ef5350"></div>転（やまば）</div>
        <div class="legend-item"><div class="legend-dot" style="background:#5c6bc0"></div>結（おわり）</div>
      </div>

      <div class="pages" id="pages"></div>
    </div>

    <div class="steps">
      <h3>🛠 実際にAIで絵本を作る手順</h3>
      <div class="step-item"><div class="step-num">1</div><span>Claude / ChatGPT でストーリーを生成</span></div>
      <div class="step-item"><div class="step-num">2</div><span>Midjourney / DALL-E でイラストを生成</span></div>
      <div class="step-item"><div class="step-num">3</div><span>Canva でレイアウトを組む</span></div>
      <div class="step-item"><div class="step-num">4</div><span>PDF に出力して完成・共有</span></div>
    </div>
  </div>

  <script>
    // 起承転結 × 30ページ構成
    // {hero} {friend} {obstacle} {world} {message} をテンプレートに使用
    const structure = [
      // ── 起（1〜8ページ）：主人公の日常・世界の紹介 ──
      { chapter: 'ki', text: "{hero}は{world}のはずれにある小さな家に暮らしていました。" },
      { chapter: 'ki', text: "{world}はとても美しく、朝になると色とりどりの光が木々の間からさしこんできます。" },
      { chapter: 'ki', text: "でも{hero}には、ずっと気になっていることがありました。" },
      { chapter: 'ki', text: "「わたしには、何もとくいなことがない」と、{hero}はいつも思っていたのです。" },
      { chapter: 'ki', text: "ある日の朝、{hero}が川のほとりを歩いていると、草むらから小さな声が聞こえました。" },
      { chapter: 'ki', text: "のぞいてみると、そこには{friend}がいました。足をケガして、動けなくなっています。" },
      { chapter: 'ki', text: "「だいじょうぶ？」と{hero}は声をかけました。{friend}はおびえた目で{hero}を見つめました。" },
      { chapter: 'ki', text: "{hero}はそっとかたわらにすわり、やさしく話しかけました。やがて{friend}は少しだけ笑いました。" },

      // ── 承（9〜17ページ）：冒険の始まり・関係が深まる ──
      { chapter: 'sho', text: "二人は仲よくなり、毎日いっしょに{world}を探検するようになりました。" },
      { chapter: 'sho', text: "{friend}は{world}のことをなんでも知っていました。{hero}は目をかがやかせて話を聞きました。" },
      { chapter: 'sho', text: "「あの山のむこうには、星の花が咲いているんだ」と{friend}が言いました。" },
      { chapter: 'sho', text: "{hero}は「いつか一緒に見にいこう！」と約束しました。{friend}は大きくうなずきました。" },
      { chapter: 'sho', text: "しかしある夜、{world}に異変が起きました。{obstacle}。" },
      { chapter: 'sho', text: "次の朝、{world}はすっかり変わってしまっていました。花も光も、どこかに消えてしまったのです。" },
      { chapter: 'sho', text: "「どうしよう…」と{hero}はふるえました。{friend}も不安そうに{hero}を見つめています。" },
      { chapter: 'sho', text: "「このままではいけない」と{hero}は思いました。でも、何をすればいいのかわかりません。" },
      { chapter: 'sho', text: "村のお年寄りは言いました。「{world}の中心にある古い泉を見つければ、きっと道が開ける」" },

      // ── 転（18〜24ページ）：最大の試練・葛藤・乗り越え ──
      { chapter: 'ten', text: "二人は泉を探して{world}の奥へと進みました。道は険しく、何度も迷いそうになります。" },
      { chapter: 'ten', text: "途中、大きな岩がふさがっていました。{hero}の力では、どうしても動きません。" },
      { chapter: 'ten', text: "{hero}はくやしくて、涙がこぼれました。「やっぱりわたしには何もできない……」" },
      { chapter: 'ten', text: "すると{friend}が言いました。「ちがう。きみはいつも、あきらめずに考えつづけている。それがすごいんだ」" },
      { chapter: 'ten', text: "{hero}は立ち上がりました。よく見ると、岩のそばに細いすき間がありました。" },
      { chapter: 'ten', text: "二人で力を合わせると、すき間から光がさしこんできました。道がひらけたのです！" },
      { chapter: 'ten', text: "ようやくたどり着いた泉は、すっかりにごっていました。{hero}は泉に向かって、心の中で願いました。" },

      // ── 結（25〜30ページ）：解決・成長・しめくくり ──
      { chapter: 'ke', text: "すると泉がゆっくりとかがやきはじめ、{world}全体に光がもどってきました。" },
      { chapter: 'ke', text: "花が咲き、鳥が歌い、{world}はもとの美しさをとりもどしました。" },
      { chapter: 'ke', text: "{hero}と{friend}は、約束していた星の花を、ついに一緒に見ることができました。" },
      { chapter: 'ke', text: "{hero}はそのとき気がつきました。「とくいなことなんてなくていい。あきらめないことが、わたしの力だったんだ」" },
      { chapter: 'ke', text: "{friend}は{hero}の手をにぎりました。「また一緒に冒険しよう」。二人はほほえみあいました。" },
      { chapter: 'ke', text: "〜 {message} 〜" },
    ];

    const chapterInfo = {
      ki:  { label: '起', desc: 'はじまり（1〜8ページ）',  cls: 'ch-ki' },
      sho: { label: '承', desc: 'ひろがり（9〜17ページ）', cls: 'ch-sho' },
      ten: { label: '転', desc: 'やまば（18〜24ページ）',  cls: 'ch-ten' },
      ke:  { label: '結', desc: 'おわり（25〜30ページ）',  cls: 'ch-ke' },
    };

    function generate() {
      const theme    = document.getElementById('theme').value    || '勇気ある冒険';
      const hero     = document.getElementById('hero').value     || '主人公のミナ';
      const friend   = document.getElementById('friend').value   || '小さなドラゴンのリュウ';
      const obstacle = document.getElementById('obstacle').value || '突然、闇の霧が森を包んだ';
      const world    = document.getElementById('world').value    || '魔法の森';
      const msg      = document.getElementById('message').value  || 'あきらめなければ、夢は必ず叶う';

      document.getElementById('bookTitle').textContent = `「${theme}」`;
      document.getElementById('bookSub').textContent   = `主人公：${hero}　舞台：${world}`;

      const pagesEl = document.getElementById('pages');
      pagesEl.innerHTML = '';

      let lastChapter = null;
      let pageNum = 0;

      structure.forEach((item, i) => {
        // 章の切り替わりにヘッダーを挿入
        if (item.chapter !== lastChapter) {
          const info = chapterInfo[item.chapter];
          const header = document.createElement('div');
          header.className = 'chapter-header';
          header.innerHTML = `
            <div class="ch-badge ${info.cls}">${info.label}</div>
            <div>
              <div class="ch-title">${info.label}（${['起','承','転','結'].indexOf(info.label)+1}/4）</div>
              <div class="ch-desc">${info.desc}</div>
            </div>
          `;
          pagesEl.appendChild(header);
          lastChapter = item.chapter;
        }

        pageNum++;
        const text = item.text
          .replace(/{hero}/g,     hero)
          .replace(/{friend}/g,   friend)
          .replace(/{obstacle}/g, obstacle)
          .replace(/{world}/g,    world)
          .replace(/{message}/g,  msg);

        const div = document.createElement('div');
        div.className = `page ${item.chapter}`;
        div.style.animationDelay = `${i * 60}ms`;
        div.innerHTML = `<div class="page-num">ページ ${pageNum}</div>${text}`;
        pagesEl.appendChild(div);
      });

      const book = document.getElementById('book');
      book.style.display = 'block';
      book.scrollIntoView({ behavior: 'smooth' });
    }
  </script>
</body>
</html>
